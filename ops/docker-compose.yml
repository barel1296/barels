# Local PostgreSQL 16 for the Golden Influencer platform (workstation or dev box).
# Docker is optional: a native PostgreSQL 16 install works the same way
# (run db/bootstrap.sql once, then `npm run cli -- db:migrate`). See
# apps/platform/README.md §Operations.
#
#   cp ops/env.example ops/.env   # fill in the passwords
#   docker compose -f ops/docker-compose.yml --env-file ops/.env up -d
#
# The image is the floating 16.x tag; pin it by digest after the first pull
# (docker image inspect postgres:16 --format '{{index .RepoDigests 0}}').
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set PG_SUPERUSER_PASSWORD in ops/.env}
      PG_MIGRATOR_PASSWORD: ${PG_MIGRATOR_PASSWORD:?set PG_MIGRATOR_PASSWORD}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD:?set PG_APP_PASSWORD}
      PG_WORKER_PASSWORD: ${PG_WORKER_PASSWORD:?set PG_WORKER_PASSWORD}
      GOLDEN_DB: ${GOLDEN_DB:-golden}
    ports:
      - "127.0.0.1:5432:5432"   # never exposed beyond the workstation
    volumes:
      - golden-pg:/var/lib/postgresql/data
      - ../db/bootstrap.sql:/opt/golden/bootstrap.sql:ro
      - ./postgres/init-golden.sh:/docker-entrypoint-initdb.d/10-init-golden.sh:ro
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=512MB", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${GOLDEN_DB:-golden}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  golden-pg:
