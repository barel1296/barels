# Dev container for the dashboard DEMO (GitHub Codespaces or VS Code Dev Containers).
# PostgreSQL has no published port: the app container shares its network namespace and reaches it on
# 127.0.0.1:5432. The password comes from .devcontainer/.env, generated by initializeCommand on first
# creation and never committed. Telegram, Instagram, the LLM and ComfyUI are SIMULATED by the demo.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    network_mode: service:db
    volumes:
      - ../..:/workspaces:cached
    environment:
      DEMO_PG_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:?run the initializeCommand (creates .devcontainer/.env)}@127.0.0.1:5432/postgres
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run the initializeCommand (creates .devcontainer/.env)}
    volumes:
      - demo-pg:/var/lib/postgresql/data
volumes:
  demo-pg:
